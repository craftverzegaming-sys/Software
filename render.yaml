services:
  - type: web
    name: craftverze-pay
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    disk:
      name: craftverze-pay-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
